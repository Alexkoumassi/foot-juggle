<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Foot Juggle - prototype</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1410; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff; -webkit-user-select: none; user-select: none; touch-action: none; }
  #cam { position: absolute; width: 2px; height: 2px; opacity: 0.01; pointer-events: none; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: absolute; left: 0; right: 0; top: 0; padding: 14px 16px;
    padding-top: max(14px, env(safe-area-inset-top));
    display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
  #score { font-size: 64px; font-weight: 800; line-height: 1; text-shadow: 0 2px 10px rgba(0,0,0,.7);
    font-variant-numeric: tabular-nums; }
  #best { font-size: 14px; opacity: .9; margin-top: 4px; text-shadow: 0 1px 6px rgba(0,0,0,.8); }
  #btns { display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
  button { font: inherit; color: #fff; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.35);
    border-radius: 999px; padding: 9px 14px; font-size: 13px; }
  button:active { background: rgba(255,255,255,.25); }
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(5,12,9,.72); padding: 24px; text-align: center; }
  #panel { max-width: 340px; }
  #panel h1 { font-size: 30px; margin: 0 0 10px; }
  #panel p { font-size: 15px; line-height: 1.45; margin: 0 0 12px; opacity: .92; }
  #panel ol { text-align: left; font-size: 15px; line-height: 1.5; padding-left: 22px; margin: 0 0 18px; }
  #go { font-size: 18px; font-weight: 700; padding: 14px 34px; background: #1fa85a; border-color: #1fa85a; }
  #note { font-size: 13px; opacity: .8; margin-top: 14px; min-height: 1em; }
  #count { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 120px; font-weight: 800; text-shadow: 0 4px 24px rgba(0,0,0,.8); pointer-events: none; }
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="view"></canvas>

<div id="hud">
  <div>
    <div id="score">0</div>
    <div id="best">Best: 0</div>
  </div>
  <div id="btns">
    <button id="sens">Sensitivity: Med</button>
    <button id="dbg">Show motion: Off</button>
  </div>
</div>

<div id="count"></div>

<div id="overlay">
  <div id="panel">
    <h1 id="title">Foot Juggle</h1>
    <p id="sub">Keep the ball up using your real foot.</p>
    <ol id="how">
      <li>Stand up and hold the phone at chest height.</li>
      <li>Point the back camera down at your feet.</li>
      <li>Move your foot under the ring and kick as the ball lands.</li>
    </ol>
    <button id="go">Start</button>
    <div id="note"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var video = document.getElementById('cam');
  var canvas = document.getElementById('view');
  var ctx = canvas.getContext('2d');
  var proc = document.createElement('canvas');
  var pctx = proc.getContext('2d', { willReadFrequently: true });

  var elScore = document.getElementById('score');
  var elBest = document.getElementById('best');
  var elOverlay = document.getElementById('overlay');
  var elTitle = document.getElementById('title');
  var elSub = document.getElementById('sub');
  var elHow = document.getElementById('how');
  var elGo = document.getElementById('go');
  var elNote = document.getElementById('note');
  var elCount = document.getElementById('count');
  var elSens = document.getElementById('sens');
  var elDbg = document.getElementById('dbg');

  // ---------- tuning ----------
  var G = 10;                 // gravity (height units / s^2)
  var KICK_Z = 0.6;           // ball can be kicked once it falls below this height
  var GRACE_MS = 110;         // forgiveness after the ball touches the ground
  var PIXEL_DIFF = 24;        // brightness change that counts as "moved"
  var BG_FACTOR = 1.4;        // how strongly whole-picture motion (phone shake) is discounted
  var SENS = [
    { name: 'Low', t: 0.30 },
    { name: 'Med', t: 0.18 },
    { name: 'High', t: 0.10 }
  ];
  var sensIdx = 1;
  var debug = false;

  // ---------- state ----------
  var W = 0, H = 0, DPR = 1, r0 = 40;
  var gw = 72, gh = 128, prev = null, heat = null, havePrev = false;
  var camOn = false, demo = false;
  var state = 'menu';         // menu | countdown | play | over
  var score = 0, best = 0;
  var ball = { x: 0, y: 0, z: 2, vx: 0, vy: 0, vz: 0, spin: 0, groundT: 0 };
  var lastKickT = 0, flash = 0, lastT = 0, lastProcT = 0, countEnd = 0;
  var audio = null;

  try { best = parseInt(localStorage.getItem('footjuggle_best') || '0', 10) || 0; } catch (e) {}
  elBest.textContent = 'Best: ' + best;

  // ---------- layout ----------
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    DPR = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    r0 = Math.min(W, H) * 0.095;
    gw = 72; gh = Math.max(24, Math.round(gw * H / W));
    proc.width = gw; proc.height = gh;
    prev = new Uint8Array(gw * gh);
    heat = new Float32Array(gw * gh);
    havePrev = false;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- camera ----------
  function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return Promise.reject(new Error('Camera needs a secure (https) page.'));
    }
    return navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 60 } }
    }).then(function (stream) {
      video.srcObject = stream;
      return video.play();
    }).then(function () { camOn = true; demo = false; });
  }

  function drawVideo() {
    var vw = video.videoWidth, vh = video.videoHeight;
    if (camOn && vw && vh) {
      var s = Math.max(W / vw, H / vh);
      var sw = W / s, sh = H / s, sx = (vw - sw) / 2, sy = (vh - sh) / 2;
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, W, H);
      pctx.drawImage(video, sx, sy, sw, sh, 0, 0, gw, gh);
      return true;
    }
    // no camera: plain pitch background
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1d6b3c'); g.addColorStop(1, '#0f4526');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    for (var i = 0; i < 8; i += 2) ctx.fillRect(0, i * H / 8, W, H / 8);
    return false;
  }

  // ---------- motion detection ----------
  function processMotion(dt) {
    var d = pctx.getImageData(0, 0, gw, gh).data;
    var decay = Math.pow(0.5, dt / 0.12);
    var n = gw * gh;
    for (var i = 0, j = 0; i < n; i++, j += 4) {
      var gray = (d[j] + d[j + 1] + d[j + 2]) / 3 | 0;
      var h = heat[i] * decay;
      if (havePrev && Math.abs(gray - prev[i]) > PIXEL_DIFF) h += 1;
      heat[i] = h;
      prev[i] = gray;
    }
    havePrev = true;
  }

  // How much is moving around the ball's landing spot, compared with the rest of the picture.
  function regionMotion() {
    var cxg = ball.x / W * gw, cyg = ball.y / H * gh;
    var rg = r0 * 1.45 / W * gw, r2 = rg * rg;
    var inSum = 0, inN = 0, outSum = 0, outN = 0, mx = 0, my = 0;
    for (var y = 0; y < gh; y++) {
      var dy = y + 0.5 - cyg;
      for (var x = 0; x < gw; x++) {
        var dx = x + 0.5 - cxg, h = heat[y * gw + x];
        if (dx * dx + dy * dy <= r2) { inSum += h; inN++; mx += h * x; my += h * y; }
        else { outSum += h; outN++; }
      }
    }
    var inMean = inN ? inSum / inN : 0, outMean = outN ? outSum / outN : 0;
    return {
      score: inMean - BG_FACTOR * outMean,
      cx: inSum > 0 ? (mx / inSum + 0.5) / gw * W : ball.x,
      cy: inSum > 0 ? (my / inSum + 0.5) / gh * H : ball.y
    };
  }

  // ---------- sound ----------
  function beep(freq, dur, type, vol) {
    if (!audio) return;
    try {
      var o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.5), t + dur);
      g.gain.setValueAtTime(vol || 0.25, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(audio.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  }

  // ---------- game ----------
  function rnd(a) { return (Math.random() * 2 - 1) * a; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  function resetBall() {
    ball.x = W / 2; ball.y = H * 0.58; ball.z = 2.4;
    ball.vx = 0; ball.vy = 0; ball.vz = 0; ball.groundT = 0;
  }

  function begin() {
    score = 0; elScore.textContent = '0';
    resetBall();
    for (var i = 0; i < heat.length; i++) heat[i] = 0;
    state = 'countdown';
    countEnd = performance.now() + 3000;
    elOverlay.style.display = 'none';
    elCount.style.display = 'flex';
  }

  function kick(power, hitX, hitY, t) {
    var hard = 1 + Math.min(score, 30) / 30 * 0.6;
    var dx = clamp((ball.x - hitX) / r0, -1, 1), dy = clamp((ball.y - hitY) / r0, -1, 1);
    ball.vx = (dx * W * 0.20 + rnd(W * 0.05)) * hard;
    ball.vy = (dy * H * 0.10 + rnd(H * 0.035)) * hard;
    ball.vz = 5.6 + clamp(power, 0, 1) * 1.6;
    ball.z = Math.max(ball.z, 0.02);
    ball.groundT = 0;
    lastKickT = t; flash = 1;
    score++; elScore.textContent = String(score);
    beep(190 + Math.min(score, 40) * 6, 0.12, 'triangle', 0.3);
    if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }
  }

  function drop() {
    state = 'over';
    beep(120, 0.4, 'sawtooth', 0.2);
    if (score > best) {
      best = score; elBest.textContent = 'Best: ' + best;
      try { localStorage.setItem('footjuggle_best', String(best)); } catch (e) {}
    }
    elTitle.textContent = score + (score === 1 ? ' juggle' : ' juggles');
    elSub.textContent = score >= best && score > 0 ? 'New best!' : 'Best: ' + best;
    elHow.style.display = 'none';
    elGo.textContent = 'Play again';
    elOverlay.style.display = 'flex';
  }

  function update(dt, t) {
    if (state === 'countdown') {
      var left = countEnd - t;
      if (left <= 0) { elCount.style.display = 'none'; state = 'play'; }
      else elCount.textContent = String(Math.ceil(left / 1000));
      return;
    }
    if (state !== 'play') return;

    ball.vz -= G * dt;
    ball.z += ball.vz * dt;
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;
    ball.spin += ball.vx * dt * 0.012;

    // keep the landing spot on screen
    var mX = r0 * 1.3, top = H * 0.22, bot = H - r0 * 1.6;
    if (ball.x < mX) { ball.x = mX; ball.vx = Math.abs(ball.vx) * 0.7; }
    if (ball.x > W - mX) { ball.x = W - mX; ball.vx = -Math.abs(ball.vx) * 0.7; }
    if (ball.y < top) { ball.y = top; ball.vy = Math.abs(ball.vy) * 0.7; }
    if (ball.y > bot) { ball.y = bot; ball.vy = -Math.abs(ball.vy) * 0.7; }

    if (ball.z <= 0) {
      ball.z = 0; ball.vz = 0; ball.vx *= 0.9; ball.vy *= 0.9;
      if (!ball.groundT) ball.groundT = t;
    }

    if (camOn && ball.vz <= 0 && ball.z < KICK_Z && t - lastKickT > 260) {
      var m = regionMotion(), th = SENS[sensIdx].t;
      if (m.score > th) { kick((m.score - th) / 0.6, m.cx, m.cy, t); return; }
    }
    if (ball.groundT && t - ball.groundT > GRACE_MS) drop();
  }

  // tap-to-kick only when there is no camera (desktop testing)
  canvas.addEventListener('pointerdown', function (e) {
    if (!demo || state !== 'play') return;
    var dx = e.clientX - ball.x, dy = e.clientY - ball.y;
    if (ball.vz <= 0 && ball.z < 1.0 && dx * dx + dy * dy < r0 * r0 * 4) {
      kick(0.5, e.clientX, e.clientY, performance.now());
    }
  });

  // ---------- drawing ----------
  function pentagon(cx, cy, r, rot) {
    ctx.beginPath();
    for (var i = 0; i < 5; i++) {
      var a = rot + i * Math.PI * 2 / 5 - Math.PI / 2;
      var px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.closePath(); ctx.fill();
  }

  function drawBall() {
    var inWindow = ball.vz <= 0 && ball.z < KICK_Z;
    var zc = Math.min(ball.z, 3);

    // landing ring + shadow on the floor
    ctx.lineWidth = 4;
    ctx.strokeStyle = inWindow ? 'rgba(60,255,140,.95)' : 'rgba(255,255,255,.75)';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, r0 * 1.3, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,' + clamp(0.5 - zc * 0.12, 0.12, 0.5) + ')';
    ctx.beginPath();
    ctx.ellipse(ball.x, ball.y, r0 * (1 - zc * 0.15), r0 * (1 - zc * 0.15) * 0.8, 0, 0, Math.PI * 2);
    ctx.fill();

    // the ball: bigger = higher (closer to the phone)
    var R = r0 * (1 + ball.z * 0.5), bx = ball.x, by = ball.y - ball.z * H * 0.045;
    ctx.save();
    ctx.beginPath(); ctx.arc(bx, by, R, 0, Math.PI * 2); ctx.clip();
    var g = ctx.createRadialGradient(bx - R * 0.35, by - R * 0.4, R * 0.1, bx, by, R);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#c9cdd2');
    ctx.fillStyle = g; ctx.fillRect(bx - R, by - R, R * 2, R * 2);
    ctx.fillStyle = '#1b1e23';
    pentagon(bx, by, R * 0.34, ball.spin);
    for (var i = 0; i < 5; i++) {
      var a = ball.spin + i * Math.PI * 2 / 5 - Math.PI / 2;
      pentagon(bx + Math.cos(a) * R * 0.92, by + Math.sin(a) * R * 0.92, R * 0.34, a + Math.PI / 2 + Math.PI);
    }
    ctx.restore();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0,0,0,.55)';
    ctx.beginPath(); ctx.arc(bx, by, R, 0, Math.PI * 2); ctx.stroke();

    if (flash > 0) {
      ctx.strokeStyle = 'rgba(255,255,255,' + flash + ')'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, r0 * (1.3 + (1 - flash) * 1.5), 0, Math.PI * 2); ctx.stroke();
    }
  }

  function drawDebug() {
    var cw = W / gw, ch = H / gh;
    ctx.fillStyle = 'rgba(0,255,120,.45)';
    for (var y = 0; y < gh; y++) for (var x = 0; x < gw; x++) {
      if (heat[y * gw + x] > 0.5) ctx.fillRect(x * cw, y * ch, cw + 0.5, ch + 0.5);
    }
  }

  function frame(t) {
    var dt = Math.min(0.05, (t - lastT) / 1000 || 0); lastT = t;
    var gotVideo = drawVideo();
    if (gotVideo && t - lastProcT >= 30) { processMotion((t - lastProcT) / 1000); lastProcT = t; }
    update(dt, t);
    if (debug && gotVideo) drawDebug();
    if (state !== 'menu') drawBall();
    flash = Math.max(0, flash - dt * 3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- buttons ----------
  elGo.addEventListener('click', function () {
    if (!audio) {
      try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (audio && audio.state === 'suspended') { audio.resume(); }
    if (camOn || demo) { begin(); return; }
    elGo.disabled = true; elNote.textContent = 'Starting camera...';
    startCamera().then(function () {
      elNote.textContent = ''; elGo.disabled = false; begin();
    }).catch(function (err) {
      demo = true; elGo.disabled = false;
      elNote.textContent = 'No camera available (' + (err && err.message ? err.message : 'blocked') +
        '). Running in tap mode: tap the ball as it lands.';
      elGo.textContent = 'Start in tap mode';
    });
  });

  elSens.addEventListener('click', function () {
    sensIdx = (sensIdx + 1) % SENS.length;
    elSens.textContent = 'Sensitivity: ' + SENS[sensIdx].name;
  });
  elDbg.addEventListener('click', function () {
    debug = !debug;
    elDbg.textContent = 'Show motion: ' + (debug ? 'On' : 'Off');
  });
})();
</script>
</body>
</html>
